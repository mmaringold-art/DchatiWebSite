# Dchati marketing website — hardened static nginx server
#
# Sits behind Nginx Proxy Manager (TLS terminated there). NPM forwards the real
# client IP in X-Forwarded-For; we restore it below so rate limiting works.

# --- rate limiting (http context; this file is included inside http) ---
limit_req_zone $binary_remote_addr zone=dchati_site:10m rate=20r/s;

# Trust the proxy (NPM / Docker private networks) to read the real client IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version
    server_tokens off;

    # Static site only needs read methods — reject everything else
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Gentle per-IP rate limit (absorbs bursts, blocks floods)
    limit_req zone=dchati_site burst=40 nodelay;
    limit_req_status 429;

    # --- security headers (sent on every response via inheritance) ---
    # These are inherited by locations that do NOT declare their own add_header.
    # The locations below use `expires` (not add_header) so they keep these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # connect-src carries exactly one third party: the Keycloak realm, which the
    # browser calls with fetch() for the PKCE token exchange and token refresh.
    # It is a single exact host, not a wildcard. Sign-in and sign-out themselves
    # are top-level navigations, which no CSP directive here governs — so
    # form-action stays 'self' (the page submits no cross-origin forms).
    #
    # DEV serves that realm at auth.dev.dchati.com. This host must match
    # `issuer` in js/auth-config.js: it is the one domain written down outside
    # that file, so an environment switch means editing both.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://auth.dev.dchati.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- block hidden/sensitive files (.git, .env, etc.), but allow .well-known ---
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # --- security.txt / well-known ---
    location ^~ /.well-known/ {
        allow all;
    }

    # --- auth scripts: siempre revalidados ---
    # Llevan la config y el flujo OIDC. Bajo la regla de 7d de abajo, un fix
    # puede quedar invisible en los navegadores durante una semana — que es
    # exactamente lo que pasó con el scope `organization`. Revalidar cuesta
    # un 304. Tiene que ir ANTES del regex genérico: nginx usa la PRIMERA
    # location regex que matchea. El query string (?v=) no participa del
    # matcheo de location, así que estas reglas aplican igual con o sin él.
    location ~* ^/js/(auth-config|auth|platform|dashboard)\.js$ {
        expires epoch;
        try_files $uri =404;
    }

    # --- long cache for static assets (expires keeps inherited headers) ---
    location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 7d;
        try_files $uri =404;
    }

    # --- HTML always revalidated (expires epoch == no-cache, keeps headers) ---
    location ~* \.html$ {
        expires epoch;
        try_files $uri =404;
    }

    # --- OIDC callback: /dashboard is the redirect_uri registered in Keycloak ---
    # Exact-match locations win over the regex ones above, so the extensionless
    # path resolves to the callback page instead of 404ing. `expires epoch`
    # (rather than add_header) keeps the inherited security headers, and keeps
    # a page that handles authorization codes out of every cache.
    location = /dashboard {
        expires epoch;
        try_files /dashboard.html =404;
    }

    location = /dashboard/ {
        expires epoch;
        try_files /dashboard.html =404;
    }

    # --- routing: serve files, fall back to 404 ---
    location / {
        try_files $uri $uri/ =404;
    }

    # lightweight health endpoint for the container orchestrator
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

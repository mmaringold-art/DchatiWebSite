# Dchati marketing website — static nginx server
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- long cache for fingerprint-free static assets ---
    location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- HTML should always be revalidated ---
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # --- routing: serve files, fall back to 404 ---
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # lightweight health endpoint for the container orchestrator
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
